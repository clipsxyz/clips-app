version: '3.8'

# Staging and production.
# Compose fills ${...} from the shell or the repo-root .env. Secrets stay in that file.
# Laravel reads laravel-backend/.env at runtime, then the environment block overrides
# the database path, public URL, and Reverb hostname so they match this stack.
# Do not publish port 8000: the Mac already uses it for local PHP.

services:
  clips-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost/api}
        VITE_USE_LARAVEL_API: ${VITE_USE_LARAVEL_API:-true}
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY:-}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:-}
        VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
        VITE_FIREBASE_MEASUREMENT_ID: ${VITE_FIREBASE_MEASUREMENT_ID:-}
        VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
        VITE_SOCKETIO_URL: ${VITE_SOCKETIO_URL:-}
    container_name: clips-app
    ports:
      - "80:80"
    restart: unless-stopped
    depends_on:
      laravel:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - clips-network

  laravel:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: gazetteer-laravel
    expose:
      - "8000"
    env_file:
      - laravel-backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_APP_URL: ${FRONTEND_APP_URL:-http://localhost}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      FILESYSTEM_DISK: public
      BROADCAST_CONNECTION: reverb
      BROADCAST_DRIVER: reverb
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      LOG_CHANNEL: stderr
    volumes:
      - gazetteer-sqlite:/data
      - gazetteer-uploads:/var/www/html/storage/app/public
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8000) ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    networks:
      - clips-network

  reverb:
    build:
      context: ./laravel-backend
      dockerfile: Dockerfile
    container_name: gazetteer-reverb
    command: ["reverb"]
    ports:
      - "8080:8080"
    env_file:
      - laravel-backend/.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost}
      DB_CONNECTION: sqlite
      DB_DATABASE: /data/database.sqlite
      BROADCAST_CONNECTION: reverb
      BROADCAST_DRIVER: reverb
      REVERB_HOST: reverb
      REVERB_PORT: "8080"
      REVERB_SCHEME: http
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: "8080"
      LOG_CHANNEL: stderr
    volumes:
      - gazetteer-sqlite:/data
      - gazetteer-uploads:/var/www/html/storage/app/public
    depends_on:
      laravel:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - clips-network

  # Legacy Socket.IO DM server. Leave this commented out.
  # The web build connects only when VITE_SOCKETIO_URL is set.
  # socketio-server:
  #   build:
  #     context: ./socketio-server
  #     dockerfile: Dockerfile
  #   container_name: socketio-dm-server
  #   ports:
  #     - "3001:3001"
  #   environment:
  #     - PORT=3001
  #   restart: unless-stopped
  #   networks:
  #     - clips-network

networks:
  clips-network:
    driver: bridge

volumes:
  gazetteer-sqlite:
  gazetteer-uploads:
